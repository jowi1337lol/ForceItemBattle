name: Build ForceItemBattle Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Unzip and build
      run: |
        unzip fib_plugin_source.zip
        ls -la fib_plugin/
        cd fib_plugin
        mvn clean package -q 2>&1 || mvn clean package

    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: ForceItemBattle
        path: fib_plugin/target/ForceItemBattle.jar
        if-no-files-found: error
