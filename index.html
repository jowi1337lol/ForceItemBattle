<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lilly Kolbow</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #EAE4F4;
      --navy: #1B1464;
      --card: rgba(255, 255, 255, 0.6);
      --card-hover: rgba(255, 255, 255, 0.85);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      color: var(--navy);
      overflow-x: hidden;
    }

    /* ── Floating background orbs ── */
    .orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.35;
      animation: floatOrb 10s ease-in-out infinite;
    }
    .orb-1 { width: 350px; height: 350px; background: #C9B8EC; top: -120px; left: -80px; animation-delay: 0s; }
    .orb-2 { width: 220px; height: 220px; background: #B0A0DC; bottom: 150px; right: -60px; animation-delay: -4s; }
    .orb-3 { width: 180px; height: 180px; background: #D8CCF0; top: 45%; left: 40%; animation-delay: -7s; }

    @keyframes floatOrb {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%       { transform: translate(18px, -28px) scale(1.06); }
      66%       { transform: translate(-12px, 18px) scale(0.95); }
    }

    /* ── Page container ── */
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 48px 22px 72px;
      position: relative;
      z-index: 1;
    }

    /* ── Profile ── */
    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 36px;
    }

    /* Arch photo */
    .arch-wrap {
      width: 230px;
      height: 290px;
      border-radius: 120px 120px 20px 20px;
      overflow: hidden;
      margin-bottom: 30px;
      box-shadow: 0 16px 48px rgba(27, 20, 100, 0.18);
      opacity: 0;
      transform: translateY(-24px);
      animation: slideDown 0.9s cubic-bezier(0.34, 1.4, 0.64, 1) 0.2s forwards;
      position: relative;
    }
    .arch-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 55%, rgba(234, 228, 244, 0.25) 100%);
    }
    .arch-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      transition: transform 0.6s ease;
    }
    .arch-wrap:hover img { transform: scale(1.04); }

    @keyframes slideDown {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Sparkle dots around arch */
    .arch-wrap .sparkle {
      position: absolute;
      border-radius: 50%;
      background: rgba(27, 20, 100, 0.25);
      pointer-events: none;
      animation: sparkleAnim 3s ease-in-out infinite;
    }
    .sparkle-1 { width: 8px; height: 8px; top: 12px; right: 18px; animation-delay: 0s; }
    .sparkle-2 { width: 5px; height: 5px; top: 40px; left: 10px; animation-delay: -1s; }
    .sparkle-3 { width: 6px; height: 6px; bottom: 60px; right: 10px; animation-delay: -2s; }
    @keyframes sparkleAnim {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50%       { transform: scale(1.6); opacity: 0.9; }
    }

    .name {
      font-family: 'Playfair Display', serif;
      font-size: 46px;
      font-weight: 700;
      color: var(--navy);
      text-align: center;
      line-height: 1.1;
      letter-spacing: -0.5px;
      opacity: 0;
      transform: translateY(18px);
      animation: fadeUp 0.7s ease 0.9s forwards;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-align: center;
      line-height: 1.7;
      opacity: 0;
      transform: translateY(18px);
      animation: fadeUp 0.7s ease 1.1s forwards;
      color: var(--navy);
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Links ── */
    .links {
      display: flex;
      flex-direction: column;
      gap: 13px;
      width: 100%;
    }

    /* Standard link button */
    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      background: var(--card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow: 0 2px 16px rgba(27, 20, 100, 0.07);
      text-decoration: none;
      color: var(--navy);
      font-size: 15px;
      font-weight: 400;
      cursor: pointer;
      transition: transform 0.22s ease, box-shadow 0.22s ease, background 0.22s ease;
      opacity: 0;
      transform: translateY(22px);
      position: relative;
      overflow: hidden;
    }
    .link-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(255,255,255,0.35) 0%, transparent 55%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .link-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 32px rgba(27, 20, 100, 0.13);
      background: var(--card-hover);
    }
    .link-btn:hover::before { opacity: 1; }
    .link-btn:active { transform: translateY(-1px); }

    .link-btn .arrow {
      width: 34px;
      height: 34px;
      border: 1.5px solid var(--navy);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.22s ease, transform 0.22s ease, border-color 0.22s ease;
    }
    .link-btn:hover .arrow {
      background: var(--navy);
      transform: translateX(3px);
    }
    .link-btn:hover .arrow path { stroke: #fff; }

    /* Image card */
    .img-card {
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      opacity: 0;
      transform: translateY(22px);
      box-shadow: 0 6px 24px rgba(27, 20, 100, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }
    .img-card:hover {
      transform: translateY(-5px) scale(1.01);
      box-shadow: 0 16px 44px rgba(27, 20, 100, 0.16);
    }
    .img-card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }
    .img-card:hover img { transform: scale(1.04); }

    /* Fallback card when image not available */
    .img-card .img-fallback {
      width: 100%;
      height: 210px;
      background: linear-gradient(135deg, #C9B8EC 0%, #8B78C0 60%, #6B58A0 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px;
    }
    .img-fallback .brand { font-size: 11px; letter-spacing: 0.15em; color: rgba(255,255,255,0.8); margin-bottom: 6px; }
    .img-fallback .guide-title { font-size: 22px; font-weight: 700; color: #fff; line-height: 1.2; }

    /* Animate-in class triggered by IntersectionObserver */
    .reveal { animation: fadeUp 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 40px;
      font-size: 12px;
      color: rgba(27, 20, 100, 0.4);
      opacity: 0;
      animation: fadeUp 0.6s ease 1.8s forwards;
    }
  </style>
</head>
<body>

<!-- Floating orbs -->
<div class="orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="container">

  <!-- ── Profile ── -->
  <div class="profile">
    <div class="arch-wrap">
      <!--
        BILD ERSETZEN:
        Ersetze "PROFILE_IMAGE" mit der tatsächlichen Bild-URL oder einem
        lokalen Dateipfad, z.B. src="images/lilly.jpg"
      -->
      <img
        src="PROFILE_IMAGE"
        alt="Lilly Kolbow"
        onerror="
          this.style.display='none';
          this.parentElement.style.background='linear-gradient(160deg,#C9B8EC,#9080C8)';
        "
      >
      <span class="sparkle sparkle-1"></span>
      <span class="sparkle sparkle-2"></span>
      <span class="sparkle sparkle-3"></span>
    </div>

    <h1 class="name">Lilly Kolbow</h1>
    <p class="subtitle">MONAT Marketpartnerin,<br>Teamleiterin</p>
  </div>

  <!-- ── Link Buttons ── -->
  <div class="links">

    <!-- Zum MONAT Shop -->
    <a href="#" class="link-btn" data-delay="0">
      <span>Zum MONAT Shop</span>
      <div class="arrow">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <path d="M2 6.5h9M7 2l4.5 4.5L7 11" stroke="#1B1464" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </a>

    <!-- MONAT Produktguide Bild-Card -->
    <div class="img-card" data-delay="120">
      <!--
        BILD ERSETZEN:
        Ersetze "MONAT_GUIDE_IMAGE" mit der tatsächlichen Bild-URL
        z.B. src="images/monat-guide.jpg"
      -->
      <img
        src="MONAT_GUIDE_IMAGE"
        alt="MONAT Produktguide"
        onerror="
          this.style.display='none';
          this.nextElementSibling.style.display='flex';
        "
      >
      <div class="img-fallback" style="display:none;">
        <span class="brand">MONAT®</span>
        <span class="guide-title">PRODUKT<br>INFORMATIONS<br>GUIDE</span>
      </div>
    </div>

    <!-- Über MONAT / Produktguide -->
    <a href="#" class="link-btn" data-delay="240">
      <span>Über MONAT / Produktguide</span>
      <div class="arrow">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <path d="M2 6.5h9M7 2l4.5 4.5L7 11" stroke="#1B1464" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </a>

    <!-- Haarquiz -->
    <a href="#" class="link-btn" data-delay="360">
      <span>Haarquiz. 👩‍🦱👩‍🦰👱‍♀️👩‍🦱</span>
      <div class="arrow">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <path d="M2 6.5h9M7 2l4.5 4.5L7 11" stroke="#1B1464" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </a>

  </div>

  <p class="footer">© 2025 Lilly Kolbow · Lillys Welt</p>
</div>

<script>
  // Staggered scroll-reveal for buttons and cards
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const delay = parseInt(entry.target.dataset.delay || 0);
      setTimeout(() => {
        entry.target.classList.add('reveal');
      }, delay);
      observer.unobserve(entry.target);
    });
  }, { threshold: 0.15 });

  document.querySelectorAll('[data-delay]').forEach(el => observer.observe(el));

  // Subtle parallax on orbs while scrolling
  window.addEventListener('scroll', () => {
    const y = window.scrollY;
    document.querySelector('.orb-1').style.transform = `translate(${y * 0.04}px, ${y * 0.08}px)`;
    document.querySelector('.orb-2').style.transform = `translate(${-y * 0.06}px, ${y * 0.04}px)`;
    document.querySelector('.orb-3').style.transform = `translate(${y * 0.02}px, ${-y * 0.05}px)`;
  }, { passive: true });

  // Cursor glow effect on buttons
  document.querySelectorAll('.link-btn').forEach(btn => {
    btn.addEventListener('mousemove', (e) => {
      const rect = btn.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 100;
      btn.style.background = `radial-gradient(circle at ${x}% ${y}%, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.6) 100%)`;
    });
    btn.addEventListener('mouseleave', () => {
      btn.style.background = '';
    });
  });
</script>
</body>
</html>
